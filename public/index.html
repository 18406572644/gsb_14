<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可靠聊天室</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #0f1420; color: #dde3f0; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #161d2e; }
  header h1 { font-size: 16px; margin-right: auto; }
  #status { width: 10px; height: 10px; border-radius: 50%; background: #666; }
  #status.on { background: #3ecf6e; } #status.off { background: #e05252; }
  input, button { font: inherit; padding: 7px 10px; border-radius: 6px; border: 1px solid #2a3550;
                  background: #1c2539; color: inherit; }
  button { cursor: pointer; background: #2f6fed; border-color: #2f6fed; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 220px; background: #161d2e; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #sidebar .room { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
  #sidebar .room.active, #sidebar .room:hover { background: #24304d; }
  #sidebar .badge { color: #7f8db3; font-size: 12px; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 10px; background: #1c2539; align-self: flex-start; }
  .msg.mine { background: #2f6fed; align-self: flex-end; }
  .msg .meta { font-size: 11px; opacity: .65; margin-bottom: 2px; }
  .msg .tick { font-size: 11px; opacity: .7; }
  .sys { align-self: center; font-size: 12px; color: #7f8db3; }
  #composer { display: flex; gap: 8px; padding: 12px 16px; background: #161d2e; }
  #composer input { flex: 1; }
  #members { width: 200px; background: #161d2e; padding: 12px; overflow-y: auto; }
  #members .m { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 13px; }
  #members .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  #members .dot.on { background: #3ecf6e; }
  #members .tag { font-size: 11px; color: #f0b429; }
  #members .tag.muted { color: #e05252; }
  #members button { padding: 2px 6px; font-size: 11px; margin-left: auto; }
  .member-actions { display: flex; gap: 6px; margin-bottom: 10px; }
  .member-actions button { font-size: 12px; padding: 4px 8px; margin: 0; }
  #inviteBadge { position: absolute; top: -6px; right: -4px; background: #e05252; color: #fff;
                 border-radius: 9px; font-size: 10px; line-height: 14px; padding: 0 5px; }
  #toasts { position: fixed; top: 52px; right: 16px; display: flex; flex-direction: column;
            gap: 8px; z-index: 30; }
  .toast { padding: 10px 14px; border-radius: 8px; background: #24304d; border: 1px solid #2f3d63;
           max-width: 320px; box-shadow: 0 6px 20px rgba(0,0,0,.4); font-size: 13px; }
  .toast.ok { border-color: #2e7d4f; }
  .toast.warn { border-color: #a34343; }
  #modalBackdrop { position: fixed; inset: 0; background: rgba(8,12,22,.6); z-index: 20;
                   display: flex; align-items: center; justify-content: center; }
  .modal-card { background: #161d2e; border: 1px solid #2a3550; border-radius: 10px;
                width: 380px; max-width: 92vw; max-height: 70vh; display: flex; flex-direction: column; }
  .modal-head { display: flex; justify-content: space-between; align-items: center;
                padding: 12px 14px; border-bottom: 1px solid #24304d; }
  .modal-head button { padding: 0 8px; background: none; border: none; font-size: 18px; }
  #modalBody { padding: 10px 14px; overflow-y: auto; }
  .inv { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-bottom: 1px solid #20294a; }
  .inv:last-child { border-bottom: none; }
  .inv .row { display: flex; gap: 8px; align-items: center; }
  .inv .st { font-size: 11px; color: #7f8db3; }
  .inv button { padding: 3px 10px; font-size: 12px; margin: 0; }
  .inv .ghost { background: #3a4666; border-color: #3a4666; }
  .empty { color: #7f8db3; font-size: 12px; padding: 12px 0; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>可靠聊天室</h1>
  <span id="status" class="off"></span><span id="statusText">未连接</span>
  <span id="who"></span>
  <button id="myInvitesBtn" class="hidden" style="position:relative;margin-left:10px;background:#3a4666;border-color:#3a4666">
    我的邀请<span id="inviteBadge" class="hidden">0</span>
  </button>
</header>

<div id="toasts"></div>

<main>
  <div id="sidebar">
    <form id="loginForm">
      <input id="nameInput" placeholder="输入昵称登录" maxlength="32" required style="width:100%">
      <button style="width:100%;margin-top:8px">登录</button>
    </form>
    <div id="roomPanel" class="hidden" style="display:flex;flex-direction:column;gap:8px">
      <form id="createForm" style="display:flex;gap:6px">
        <input id="roomInput" placeholder="房间名" maxlength="64" style="flex:1;min-width:0">
        <button type="submit">建</button>
      </form>
      <button id="joinBtn">加入房间</button>
      <div id="roomList"></div>
    </div>
  </div>

  <div id="chat">
    <div id="messages"></div>
    <form id="composer" class="hidden">
      <input id="msgInput" placeholder="发送消息…" autocomplete="off">
      <button type="submit">发送</button>
    </form>
  </div>

  <div id="members" class="hidden"></div>
</main>

<div id="modalBackdrop" class="hidden">
  <div class="modal-card">
    <div class="modal-head"><b id="modalTitle"></b><button id="modalClose">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
'use strict';
/* 可靠投递客户端协议实现：
 * - 发送：每条消息带唯一 clientMsgId，未收到 ACK 定时重发（服务端幂等去重）；
 * - 接收：按房间记录 lastSeenSeq，seq 小于等于它的一律丢弃（幂等消费）；
 * - ACK：累积确认，500ms 批量上报；
 * - 断线补发：重连后重新 join 并携带 lastSeenSeq，服务端回放缺口；
 * - lastSeenSeq 存 localStorage，刷新页面也不丢进度。
 */
const $ = (id) => document.getElementById(id);
let ws = null, me = null, currentRoom = null;
const rooms = new Map(); // roomId -> {name, role, mutedUntil, lastSeenSeq, msgs:[], pending:Map}
const myInvites = new Map(); // inviteId -> 发给我的待处理邀请
let reconnectDelay = 500, ackTimer = null, retryTimer = null;

const store = {
  key: () => 'chat:' + me.name,
  load() { try { return JSON.parse(localStorage.getItem(this.key())) || {}; } catch { return {}; } },
  save() {
    const o = {};
    for (const [id, r] of rooms) o[id] = { name: r.name, lastSeenSeq: r.lastSeenSeq };
    localStorage.setItem(this.key(), JSON.stringify(o));
  },
};

function setStatus(cls, text) {
  $('status').className = cls; $('statusText').textContent = text;
}

async function login(name) {
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  if (!res.ok) throw new Error('登录失败');
  return res.json();
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(me.token)}`);
  ws.onopen = () => {
    setStatus('on', '已连接'); reconnectDelay = 500;
    // 重连后恢复所有房间：携带本地进度，服务端补发缺口
    const saved = store.load();
    for (const [roomId, info] of Object.entries(saved)) {
      ws.send(JSON.stringify({ type: 'join', room: roomId, lastSeq: info.lastSeenSeq || 0 }));
    }
    // 拉取离线期间收到/未处理的邀请
    ws.send(JSON.stringify({ type: 'invite_pending' }));
  };
  ws.onmessage = (ev) => handle(JSON.parse(ev.data));
  ws.onclose = () => {
    setStatus('off', `已断开，${reconnectDelay}ms 后重连…`);
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 10000);
  };
  ws.onerror = () => ws.close();
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function handle(m) {
  switch (m.type) {
    case 'welcome': break;
    case 'joined': {
      const saved = store.load();
      const r = rooms.get(m.roomId) || { msgs: [], pending: new Map(), lastSeenSeq: 0 };
      r.name = m.name; r.role = m.role; r.mutedUntil = m.mutedUntil;
      r.lastSeenSeq = Math.max(r.lastSeenSeq, saved[m.roomId]?.lastSeenSeq || 0);
      rooms.set(m.roomId, r);
      // 入房即持久化：接受邀请后刷新/重连都会自动重新加入并补发（成员身份在服务端持久生效）
      store.save();
      if (!currentRoom) currentRoom = m.roomId;
      renderRooms(); render(); refreshMembers();
      break;
    }
    case 'msg': {
      const r = rooms.get(m.roomId); if (!r) break;
      if (m.seq <= r.lastSeenSeq) break;          // 幂等消费：重复投递直接丢弃
      r.lastSeenSeq = m.seq;
      // 自己发的消息：广播回包更新乐观插入的占位消息，不重复上屏
      const own = m.clientMsgId ? r.msgs.findIndex((x) => x.clientMsgId === m.clientMsgId) : -1;
      if (own >= 0) {
        r.msgs[own] = { ...m, mine: true, pending: false };
        r.pending.delete(m.clientMsgId);
      } else {
        r.msgs.push({ ...m, mine: m.from === me.userId });
      }
      if (r.msgs.length > 500) r.msgs.splice(0, r.msgs.length - 500);
      store.save(); scheduleAck();
      render();
      break;
    }
    case 'ack': {                                  // 服务端确认我发的消息（含分配的 seq）
      const r = rooms.get(m.roomId); if (!r) break;
      const p = r.pending.get(m.clientMsgId);
      if (p) p.acked = true;
      const own = r.msgs.find((x) => x.clientMsgId === m.clientMsgId);
      if (own) { own.pending = false; own.seq = m.seq; }
      render();
      break;
    }
    case 'sync_done':
      if (m.hasMore) send({ type: 'sync', roomId: m.roomId, lastSeq: m.lastSeq });
      break;
    case 'notice': {
      const r = rooms.get(m.roomId);
      if (m.event === 'member_joined') {
        if (r) sys(m.roomId, m.userId === me.userId ? '你已通过邀请加入房间' : `${m.name} 通过邀请加入了房间`);
        refreshMembers();
        break;
      }
      if (r && m.userId === me.userId) r.mutedUntil = m.event === 'muted' ? m.until : 0;
      sys(m.roomId, m.event === 'muted' ? `有成员被禁言至 ${new Date(m.until).toLocaleTimeString()}` : '有成员被解除禁言');
      refreshMembers();
      break;
    }
    case 'members':
      if (m.roomId === currentRoom) renderMembers(m.members);
      break;
    case 'invite':            // 新邀请实时推送
      myInvites.set(m.invite.id, m.invite);
      renderInviteBadge();
      toast(`收到房间「${m.invite.roomName}」的邀请（${fmtRemain(m.invite.expiresAt)}）`, 'ok');
      break;
    case 'invite_pending':    // 登录/重连后的待处理邀请清单
      myInvites.clear();
      for (const inv of m.invites) myInvites.set(inv.id, inv);
      renderInviteBadge();
      break;
    case 'invite_created':    // 管理员生成成功
      toast(`已向 ${m.invite.inviteeName} 发出邀请`, 'ok');
      break;
    case 'invites':           // 房间邀请列表
      renderRoomInvites(m.roomId, m.invites);
      break;
    case 'invite_result': {
      const inv = myInvites.get(m.inviteId);
      if (m.status === 'accepted') {
        myInvites.delete(m.inviteId);
        renderInviteBadge();
        if (m.userName) toast(`${m.userName} 接受了房间邀请`, 'ok');
        else toast('已接受邀请，正在加入房间…', 'ok');
        // 多端：非操作设备没有 joined 帧，主动按本地进度加入
        if (!rooms.has(m.roomId)) {
          const saved = store.load()[m.roomId];
          send({ type: 'join', room: m.roomId, lastSeq: saved?.lastSeenSeq || 0 });
        }
        refreshMembers();
      } else if (m.status === 'declined') {
        myInvites.delete(m.inviteId);
        renderInviteBadge();
        if (m.userName) toast(`${m.userName} 拒绝了邀请`);
        else if (inv) toast('已拒绝邀请');
      } else if (m.status === 'revoked') {
        myInvites.delete(m.inviteId);
        renderInviteBadge();
        // inv 存在说明是被邀请人视角；撤销方自己的 myInvites 中没有该邀请
        toast(inv ? `房间「${inv.roomName}」的邀请已被撤销` : '邀请已撤销', inv ? 'warn' : '');
      }
      if (modalOpen) refreshOpenModal();
      break;
    }
    case 'error':
      handleError(m);
      break;
    case 'server_shutdown': sys(currentRoom, '服务器即将重启…'); break;
  }
}

function scheduleAck() {
  if (ackTimer) return;
  ackTimer = setTimeout(() => {
    ackTimer = null;
    for (const [id, r] of rooms) if (r.lastSeenSeq > 0) send({ type: 'ack', roomId: id, seq: r.lastSeenSeq });
  }, 500);
}

function refreshMembers() { if (currentRoom) send({ type: 'members', roomId: currentRoom }); }
setInterval(refreshMembers, 5000);

// 未 ACK 的消息每秒重发一次（clientMsgId 不变，服务端幂等）
retryTimer = setInterval(() => {
  for (const [roomId, r] of rooms) {
    for (const [cid, p] of r.pending) {
      if (!p.acked && Date.now() - p.sentAt > 1000) {
        p.sentAt = Date.now();
        send({ type: 'msg', roomId, clientMsgId: cid, content: p.content });
      }
    }
  }
}, 1000);

function sys(roomId, text) {
  const r = rooms.get(roomId); if (!r) return;
  r.msgs.push({ sys: text }); render();
}

function renderRooms() {
  $('roomList').innerHTML = [...rooms].map(([id, r]) =>
    `<div class="room ${id === currentRoom ? 'active' : ''}" data-id="${id}">
       <span>${escapeHtml(r.name || id)}</span>
       <span class="badge">${r.role === 'admin' ? '管理员' : ''}</span>
     </div>`).join('');
  for (const el of $('roomList').children) {
    el.onclick = () => { currentRoom = el.dataset.id; renderRooms(); render(); refreshMembers(); };
  }
}

function render() {
  const r = rooms.get(currentRoom);
  $('composer').classList.toggle('hidden', !r);
  $('members').classList.toggle('hidden', !r);
  if (!r) return;
  const box = $('messages');
  box.innerHTML = r.msgs.map((m) => {
    if (m.sys) return `<div class="sys">${escapeHtml(m.sys)}</div>`;
    const tick = m.mine ? `<span class="tick">${m.pending ? '…' : '✓'}</span>` : '';
    return `<div class="msg ${m.mine ? 'mine' : ''}">
      <div class="meta">${escapeHtml(m.fromName || '')} · #${m.seq} ${tick}</div>
      <div>${escapeHtml(m.content)}</div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
  const muted = r.mutedUntil > Date.now();
  $('msgInput').placeholder = muted ? `你已被禁言至 ${new Date(r.mutedUntil).toLocaleTimeString()}` : '发送消息…';
  $('msgInput').disabled = muted;
}

// 把 members 响应接进渲染
function renderMembers(list) {
  const r = rooms.get(currentRoom); if (!r) return;
  const adminActions = r.role === 'admin'
    ? `<div class="member-actions">
         <button data-act="invite-user">邀请成员</button>
         <button data-act="invite-list" class="ghost" style="background:#3a4666;border-color:#3a4666">邀请记录</button>
       </div>` : '';
  $('members').innerHTML = '<b>成员</b>' + adminActions + list.map((m) => {
    const muted = m.mutedUntil > Date.now();
    const adminBtns = r.role === 'admin' && m.userId !== me.userId && m.role !== 'admin'
      ? (muted ? `<button data-act="unmute" data-uid="${m.userId}">解禁</button>`
               : `<button data-act="mute" data-uid="${m.userId}">禁言</button>`) : '';
    return `<div class="m"><span class="dot ${m.online ? 'on' : ''}"></span>
      ${escapeHtml(m.name)}
      ${m.role === 'admin' ? '<span class="tag">管理员</span>' : ''}
      ${muted ? '<span class="tag muted">禁言中</span>' : ''}
      ${adminBtns}</div>`;
  }).join('');
  $('members').querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      if (b.dataset.act === 'mute') {
        const mins = prompt('禁言时长（分钟）', '10');
        if (mins) send({ type: 'mute', roomId: currentRoom, userId: b.dataset.uid, minutes: Number(mins) });
      } else if (b.dataset.act === 'unmute') {
        send({ type: 'unmute', roomId: currentRoom, userId: b.dataset.uid });
      } else if (b.dataset.act === 'invite-user') {
        const userName = prompt('被邀请用户的昵称（对方需已登录过一次）');
        if (!userName) return;
        const minsRaw = prompt('有效期（分钟，留空使用默认 1440 分钟）', '');
        const minutes = minsRaw && minsRaw.trim() ? Number(minsRaw) : undefined;
        send({ type: 'invite_create', roomId: currentRoom, userName: userName.trim(), minutes });
      } else if (b.dataset.act === 'invite-list') {
        openModal(`「${r.name}」邀请记录`, 'room', currentRoom);
      }
    };
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------- 邀请 UI

const INVITE_ERROR_CN = {
  FORBIDDEN: '没有权限执行该操作',
  NO_SUCH_USER: '目标用户不存在（需要对方先登录过一次）',
  ALREADY_MEMBER: '对方已经是房间成员',
  ROOM_FULL: '房间人数已达上限',
  NO_SUCH_INVITE: '邀请不存在',
  INVITE_NOT_OPEN: '邀请已失效（已使用、已拒绝或已撤销）',
  INVITE_EXPIRED: '邀请已过期',
};

function toast(text, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; }, 3500);
  setTimeout(() => el.remove(), 4000);
}

function fmtRemain(expiresAt) {
  const ms = expiresAt - Date.now();
  if (ms <= 0) return '已过期';
  const mins = Math.round(ms / 60000);
  if (mins < 60) return `${mins} 分钟后过期`;
  const hours = Math.round(mins / 60);
  if (hours < 48) return `${hours} 小时后过期`;
  return `${Math.round(hours / 24)} 天后过期`;
}

function renderInviteBadge() {
  const n = myInvites.size;
  $('inviteBadge').classList.toggle('hidden', n === 0);
  $('inviteBadge').textContent = String(n);
}

let modalOpen = false, modalKind = null, modalRoomId = null, roomInvitesCache = null;

function openModal(title, kind, roomId = null) {
  modalOpen = true; modalKind = kind; modalRoomId = roomId;
  roomInvitesCache = null;
  $('modalTitle').textContent = title;
  $('modalBackdrop').classList.remove('hidden');
  if (kind === 'room') send({ type: 'invites', roomId });
  else renderMyInvites();
}

function closeModal() {
  modalOpen = false; modalKind = null; modalRoomId = null; roomInvitesCache = null;
  $('modalBackdrop').classList.add('hidden');
  $('modalBody').innerHTML = '';
}

function refreshOpenModal() {
  if (!modalOpen) return;
  if (modalKind === 'my') renderMyInvites();
  if (modalKind === 'room') send({ type: 'invites', roomId: modalRoomId });
}

function renderMyInvites() {
  const body = $('modalBody');
  const items = [...myInvites.values()];
  if (!items.length) { body.innerHTML = '<div class="empty">暂无待处理邀请</div>'; return; }
  body.innerHTML = items.map((inv) => `
    <div class="inv">
      <div class="row"><b>${escapeHtml(inv.roomName)}</b>
        <span class="st">来自 ${escapeHtml(inv.inviterName)} · ${fmtRemain(inv.expiresAt)}</span></div>
      <div class="row">
        <button data-act="accept" data-id="${inv.id}">接受</button>
        <button class="ghost" data-act="decline" data-id="${inv.id}">拒绝</button>
      </div>
    </div>`).join('');
  body.querySelectorAll('button').forEach((b) => {
    b.onclick = () => send({
      type: b.dataset.act === 'accept' ? 'invite_accept' : 'invite_decline',
      inviteId: b.dataset.id,
    });
  });
}

/** 服务端下发某房间的邀请列表（含各状态） */
function renderRoomInvites(roomId, list) {
  roomInvitesCache = { roomId, list };
  if (modalOpen && modalKind === 'room' && modalRoomId === roomId) renderRoomInvitesBody();
}

function renderRoomInvitesBody() {
  const body = $('modalBody');
  if (!roomInvitesCache || roomInvitesCache.roomId !== modalRoomId) {
    body.innerHTML = '<div class="empty">加载中…</div>';
    return;
  }
  const list = roomInvitesCache.list;
  if (!list.length) { body.innerHTML = '<div class="empty">该房间暂无邀请记录</div>'; return; }
  const stText = {
    pending: '待接受', accepted: '已加入', declined: '已拒绝', revoked: '已撤销', expired: '已过期',
  };
  body.innerHTML = list.map((inv) => `
    <div class="inv">
      <div class="row"><b>${escapeHtml(inv.inviteeName)}</b>
        <span class="st">${stText[inv.status] || inv.status} · ${inv.status === 'pending' ? fmtRemain(inv.expiresAt) : ''}</span></div>
      ${inv.status === 'pending'
        ? `<div class="row"><button data-act="revoke" data-id="${inv.id}">撤销邀请</button></div>` : ''}
    </div>`).join('');
  body.querySelectorAll('button').forEach((b) => {
    b.onclick = () => send({ type: 'invite_revoke', inviteId: b.dataset.id });
  });
}

/** 邀请类失败走 toast；其他错误照旧进房间系统消息 */
function handleError(m) {
  if (m.action && m.action.startsWith('invite')) {
    toast(`邀请操作失败：${INVITE_ERROR_CN[m.code] || m.message}`, 'warn');
    if (m.action === 'invite_accept' || m.action === 'invite_decline') send({ type: 'invite_pending' });
    if (modalOpen) refreshOpenModal();
    return;
  }
  sys(currentRoom, `错误 [${m.code}] ${m.message}`);
}

// ---------------------------------------------------------------- 事件绑定

$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const name = $('nameInput').value.trim(); if (!name) return;
  me = await login(name);
  // 恢复房间进度
  const saved = store.load();
  for (const [id, info] of Object.entries(saved)) {
    rooms.set(id, { name: info.name, msgs: [], pending: new Map(), lastSeenSeq: info.lastSeenSeq || 0 });
  }
  $('loginForm').classList.add('hidden');
  $('roomPanel').classList.remove('hidden');
  $('myInvitesBtn').classList.remove('hidden');
  $('who').textContent = `${me.name} (${me.userId})`;
  connect();
};

$('createForm').onsubmit = (e) => {
  e.preventDefault();
  const name = $('roomInput').value.trim(); if (!name) return;
  send({ type: 'create_room', name });
  $('roomInput').value = '';
};

$('joinBtn').onclick = () => {
  const name = prompt('输入要加入的房间名');
  if (name) send({ type: 'join', room: name, lastSeq: 0 });
};

$('myInvitesBtn').onclick = () => openModal('我的邀请', 'my');
$('modalClose').onclick = closeModal;
$('modalBackdrop').onclick = (e) => { if (e.target === $('modalBackdrop')) closeModal(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOpen) closeModal(); });

$('composer').onsubmit = (e) => {
  e.preventDefault();
  const content = $('msgInput').value.trim(); if (!content || !currentRoom) return;
  const cid = crypto.randomUUID();
  const r = rooms.get(currentRoom);
  r.pending.set(cid, { content, sentAt: Date.now(), acked: false });
  r.msgs.push({ mine: true, fromName: me.name, content, seq: '…', pending: true, clientMsgId: cid });
  send({ type: 'msg', roomId: currentRoom, clientMsgId: cid, content });
  $('msgInput').value = '';
  render();
};
</script>
</body>
